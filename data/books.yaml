# The Books page (content/books.md) is built from this file.
# Each shelf has a name, an optional blurb and a list of books.
# Book fields: title, author, note (optional), cover (optional, a file in static/books/covers/),
# volumes (optional, for a box set that should get a wider spine).
# To add a cover for a new book: node scripts/fetch-cover.mjs "Title" "Author"
shelves:
  - name: "Stories"
    blurb: "Lives, adventures and novels which are hard to put down - both real and invented."
    books:
      - title: "Surely You're Joking, Mr Feynman"
        author: "Richard Feynman"
        note: "Amazing stories from one of the best physicists."
        cover: "surely-you-re-joking-mr-feynman.jpg"
      - title: "Grinding It Out"
        author: "Ray Kroc"
        note: "Story of McDonald's and how they approached scaling written from the perspective of the CEO. Great story about how it's never too late to accomplish anything."
        cover: "grinding-it-out.jpg"
      - title: "38 Letters from J.D. Rockefeller to His Son"
        author: "John D. Rockefeller"
        note: "Mostly about Rockefeller's values from his perspective written to his son. He's a great writer and communicator."
        cover: "38-letters-from-j-d-rockefeller-to-his-son.jpg"
      - title: "Elon Musk"
        author: "Walter Isaacson"
        cover: "elon-musk.jpg"
      - title: "A Man for All Markets"
        author: "Edward O. Thorp"
        note: "A trader story but written well. Ed Thorp is one of the most inspiring people I have read about."
        cover: "a-man-for-all-markets.jpg"
      - title: "Into Thin Air"
        author: "Jon Krakauer"
        note: "I do a lot of mountaineering. Incredible story about a team which got stuck on Everest during a storm. Jon Krakauer happened to be a reporter within the team who survived to tell the story."
        cover: "into-thin-air.jpg"
      - title: "Into the Wild"
        author: "Jon Krakauer"
        note: "A boy gives away his trust fund to go live in Alaska in the wild."
        cover: "into-the-wild.jpg"
      - title: "Poor Charlie's Almanack"
        author: "Charles T. Munger"
        note: "Has some really good bits."
        cover: "poor-charlie-s-almanack.jpg"
      - title: "The Man Who Solved the Market"
        author: "Gregory Zuckerman"
        note: "RenTech's success is something every trader and hedge fund aspires to achieve. This book does a good summary of their story."
        cover: "the-man-who-solved-the-market.jpg"
      - title: "Hillbilly Elegy"
        author: "J.D. Vance"
        note: "Good story about a poor boy defying the odds against him giving perspective of how my life started off with lots of advantages."
        cover: "hillbilly-elegy.jpg"
      - title: "Unstoppable: My Life So Far"
        author: "Maria Sharapova"
        note: "I always underestimated her, especially since her doping scandals but her story is one of hard work under tough conditions, at least at the start showing how determined you need to be to be at the top."
        cover: "unstoppable-my-life-so-far.jpg"
      - title: "The Innovators"
        author: "Walter Isaacson"
        note: "History of computers — very holistic and can lead you down many interesting rabbit holes."
        cover: "the-innovators.jpg"
      - title: "Catherine the Great: Portrait of a Woman"
        author: "Robert K. Massie"
        note: "She was an amazing woman, incredibly inspiring, determined and dedicated to being Empress."
        cover: "catherine-the-great-portrait-of-a-woman.jpg"
      - title: "Nicholas and Alexandra"
        author: "Robert K. Massie"
        note: "Story of the Romanovs before and during the Russian Revolution."
        cover: "nicholas-and-alexandra.jpg"
      - title: "Genghis Khan and the Making of the Modern World"
        author: "Jack Weatherford"
        cover: "genghis-khan-and-the-making-of-the-modern-world.jpg"
      - title: "Hero of Two Worlds"
        author: "Mike Duncan"
        note: "Mike Duncan has one of the best podcasts — Revolutions. This is the story of Marquis de Lafayette during the American and French Revolutions."
        cover: "hero-of-two-worlds.jpg"
      - title: "Columbus: The Four Voyages"
        author: "Laurence Bergreen"
        cover: "columbus-the-four-voyages.jpg"
      - title: "More Money Than God"
        author: "Sebastian Mallaby"
        note: "History of the hedge funds — a bit niche but worth knowing about."
        cover: "more-money-than-god.jpg"
      - title: "Sapiens"
        author: "Yuval Noah Harari"
        note: "A lot of my non-fiction interest started with this book."
        cover: "sapiens.jpg"
      - title: "War and Peace"
        author: "Leo Tolstoy"
        note: "On the nature of being human intertwined with the largest historical event of the time."
        cover: "war-and-peace.jpg"
      - title: "Atlas Shrugged"
        author: "Ayn Rand"
        note: "The best novel I have read."
        cover: "atlas-shrugged.jpg"
      - title: "The Fountainhead"
        author: "Ayn Rand"
        note: "The second best novel I have read, after Atlas Shrugged."
        cover: "the-fountainhead.jpg"
      - title: "We the Living"
        author: "Ayn Rand"
        note: "The third best novel I have read, after Atlas Shrugged and The Fountainhead."
        cover: "we-the-living.jpg"
      - title: "Shantaram"
        author: "Gregory David Roberts"
        note: "A great story (semi-true) about a convict who escapes from prison in Australia to India and lives in a shanty-town."
        cover: "shantaram.jpg"
      - title: "Machines Like Me"
        author: "Ian McEwan"
        note: "An alternative history of AI if Alan Turing was still alive."
        cover: "machines-like-me.jpg"
      - title: "Ragtime"
        author: "E. L. Doctorow"
        note: "American dream for 3 different families in the start of the 1900s."
        cover: "ragtime.jpg"
      - title: "The Rosie Project series"
        author: "Graeme Simsion"
        note: "A geneticist who has Asperger's makes a questionnaire in order to find a wife."
        cover: "the-rosie-project-series.jpg"

  - name: "Level Up"
    blurb: "Books that changed how I think, work and live."
    books:
      - title: "Mindset"
        author: "Carol Dweck"
        note: "One of the books I read when I was 18 which completely changed my opinion about what could be accomplished."
        cover: "mindset.jpg"
      - title: "Think and Grow Rich"
        author: "Napoleon Hill"
        note: "A lot about how you can manifest yourself to success."
        cover: "think-and-grow-rich.jpg"
      - title: "Grit"
        author: "Angela Duckworth"
        note: "A lot of it reads like: be gritty, be gritty, be gritty — but sometimes that's all you need from a book."
        cover: "grit.jpg"
      - title: "Driven from Within"
        author: "Michael Jordan"
        note: "When I am losing at tennis (or anything else), I always tell the opponent (whatever that may be) “this was the last one”. I took it from this book."
        cover: "driven-from-within.jpg"
      - title: "The Inner Game of Tennis"
        author: "Timothy Gallwey"
        note: "About trusting your intuition when you play tennis (or learn anything more generally)."
        cover: "the-inner-game-of-tennis.jpg"
      - title: "Discipline Is Destiny"
        author: "Ryan Holiday"
        note: "Full of really inspiring examples of disciplined successful people; the part about Queen Elizabeth was particularly captivating."
        cover: "discipline-is-destiny.jpg"
      - title: "Breath: The New Science of a Lost Art"
        author: "James Nestor"
        note: "I used techniques from this to increase my heart rate when tired and decrease it when I am stressed."
        cover: "breath-the-new-science-of-a-lost-art.jpg"
      - title: "Outlive"
        author: "Peter Attia"
        note: "I love Peter Attia's podcast and he puts a lot of the key concepts in a really comprehensible language."
        cover: "outlive.jpg"
      - title: "Sleep"
        author: "Nick Littlehales"
        note: "The book which changed how I sleep — cycles seem more important than time."
        cover: "sleep.jpg"
      - title: "Atomic Habits"
        author: "James Clear"
        note: "Showing up gets you 70% of the way of forming a new habit."
        cover: "atomic-habits.jpg"
      - title: "The Spark Factor"
        author: "Molly Maloof"
        note: "Health book which focuses on women's health in particular."
        cover: "the-spark-factor.jpg"
      - title: "Glucose Revolution"
        author: "Jessie Inchauspé"
        note: "I was obsessed with glucose spikes for some time and wore a glucose monitor. This book is a good intro."
        cover: "glucose-revolution.jpg"
      - title: "The Almanack of Naval Ravikant"
        author: "Eric Jorgenson"
        note: "On building wealth and valuing yourself."
        cover: "the-almanack-of-naval-ravikant.jpg"
      - title: "Lean In"
        author: "Sheryl Sandberg"
        cover: "lean-in.jpg"
      - title: "How to Win Friends and Influence People"
        author: "Dale Carnegie"
        cover: "how-to-win-friends-and-influence-people.jpg"
      - title: "Influence"
        author: "Robert Cialdini"
        note: "About the psychology of how people act around other people and how to be aware of it as we interact with each other."
        cover: "influence.jpg"
      - title: "Excellent Advice for Living"
        author: "Kevin Kelly"
        note: "Little quotes you can go back to every day."
        cover: "excellent-advice-for-living.jpg"
      - title: "Daily Rituals"
        author: "Mason Currey"
        note: "Daily habits of highly successful people. The artists and writers are my favourite — they're usually crazy."
        cover: "daily-rituals.jpg"
      - title: "Extreme Ownership"
        author: "Jocko Willink"
        note: "A lot of people avoid responsibility and owning up to mistakes and this book by a Navy SEAL explains how to take responsibility."
        cover: "extreme-ownership.jpg"
      - title: "Trillion Dollar Coach"
        author: "Eric Schmidt, Jonathan Rosenberg & Alan Eagle"
        note: "This is about THE Silicon Valley coach. One of the best ways to learn about people who we can't interact with is to of course read about them."
        cover: "trillion-dollar-coach.jpg"
      - title: "Tools of Titans"
        author: "Tim Ferriss"
        note: "Little tips from high performers on anything: exercise, food, learning, building."
        cover: "tools-of-titans.jpg"
      - title: "Deep Work"
        author: "Cal Newport"
        note: "How to start working deeply again."
        cover: "deep-work.jpg"
      - title: "A Guide to the Good Life"
        author: "William B. Irvine"
        note: "Introduction to Stoicism and how the ancient stoics practised it with examples. Useful for implementation into your daily life."
        cover: "a-guide-to-the-good-life.jpg"
      - title: "Selfish Reasons to Have More Kids"
        author: "Bryan Caplan"
        note: "The book which converted me to want to have more kids right now."
        cover: "selfish-reasons-to-have-more-kids.jpg"

  - name: "Start-up"
    blurb: "Learning how to think about startups."
    books:
      - title: "Measure What Matters"
        author: "John Doerr"
        note: "I took ages to read this and regret it. I have implemented OKRs into sports trading and personal life and want to do it at work too."
        cover: "measure-what-matters.jpg"
      - title: "Fall in Love with the Problem, Not the Solution"
        author: "Uri Levine"
        note: "Very detailed guide about the different stages throughout a startup from the founder of Waze — a little more B2C focused."
        cover: "fall-in-love-with-the-problem-not-the-solution.jpg"
      - title: "Talent"
        author: "Tyler Cowen & Daniel Gross"
        note: "This talks about how to approach hiring the best talent you can find. Full of interesting questions to ask."
        cover: "talent.jpg"
      - title: "Build"
        author: "Tony Fadell"
        note: "Mostly I saw it as career advice on what one should work on."
        cover: "build.jpg"
      - title: "Hackers & Painters"
        author: "Paul Graham"
        note: "These are just parts of Paul Graham's essays which are generally great but collected in a book. And I just love the title."
        cover: "hackers-painters.jpg"
      - title: "The Hard Thing About Hard Things"
        author: "Ben Horowitz"
        cover: "the-hard-thing-about-hard-things.jpg"
      - title: "What You Do Is Who You Are"
        author: "Ben Horowitz"
        note: "This is about company culture and learning from non-standard groups such as revolutionary groups, Mongol tribes and prison culture."
        cover: "what-you-do-is-who-you-are.jpg"
      - title: "Shoe Dog"
        author: "Phil Knight"
        note: "The story of Nike."
        cover: "shoe-dog.jpg"
      - title: "Scaling People"
        author: "Claire Hughes Johnson"
        note: "A guide to how to approach hiring, managing and developing people internally."
        cover: "scaling-people.jpg"
      - title: "No Rules Rules"
        author: "Reed Hastings"
        note: "Netflix's culture of radical candor is something I find inspiring."
        cover: "no-rules-rules.jpg"
      - title: "Who: The A Method for Hiring"
        author: "Geoff Smart & Randy Street"
        note: "Followed a lot of this during the hiring."
      - title: "Zero to One"
        author: "Peter Thiel"
        note: "The standard startup book. Short and sweet."
        cover: "zero-to-one.jpg"
      - title: "Founders at Work"
        author: "Jessica Livingston"
        note: "So many different stories about startups' early days."
        cover: "founders-at-work.jpg"
      - title: "Rework"
        author: "Jason Fried & David Heinemeier Hansson"
        note: "Concise business book which cuts through the BS of working conventions."
        cover: "rework.jpg"

  - name: "Orthogonal Learning"
    blurb: "My booklist is quite one-sided, so I try to read some different things once in a while. These don't really go into a group by themselves but deserve to be mentioned as they are great."
    books:
      - title: "Kitchen Confidential"
        author: "Anthony Bourdain"
        cover: "kitchen-confidential.jpg"
      - title: "Other Minds"
        author: "Peter Godfrey-Smith"
        note: "Inside the mind of an octopus."
        cover: "other-minds.jpg"
      - title: "Tomorrow's Table"
        author: "Pamela Ronald"
        note: "Why people misunderstand GMOs and how they can help us feed people more efficiently."
        cover: "tomorrow-s-table.jpg"
      - title: "Whole Earth Discipline"
        author: "Stewart Brand"
        note: "Author of the Whole Earth Catalog explains why more attention is needed for nuclear, genetic engineering and building cities."
        cover: "whole-earth-discipline.jpg"
      - title: "Gifts Differing"
        author: "Isabel Briggs Myers & Peter B. Myers"
        note: "The Myers-Briggs test explained. Useful way to think about how to interact with other people."
        cover: "gifts-differing.jpg"
      - title: "Fooled by Randomness"
        author: "Nassim Nicholas Taleb"
        note: "Randomness in everyday life."
        cover: "fooled-by-randomness.jpg"
      - title: "Skin in the Game"
        author: "Nassim Nicholas Taleb"
        note: "A lot about risk taking, which professions allow for this and why it's beneficial to seek those out."
        cover: "skin-in-the-game.jpg"
      - title: "On the Edge"
        author: "Nate Silver"
        note: "A little bit too gambling specific but a useful guide to how people within trading and gambling think about risk. A lot of principles I learnt from sports trading, but things such as expected value are something that you can intuitively learn to think about when making decisions."
        cover: "on-the-edge.jpg"
      - title: "Possible Minds"
        author: "John Brockman (ed.)"
        note: "Twenty-five ways of looking at AI: a compilation on AI by world leaders within the field."
        cover: "possible-minds.jpg"
      - title: "Map and Territory"
        author: "Eliezer Yudkowsky"
        note: "How to think and make decisions."
      - title: "Factfulness"
        author: "Hans Rosling"
        note: "A book showcasing how the world has improved significantly but people are not aware of this."
        cover: "factfulness.jpg"
      - title: "The Philosophical Baby"
        author: "Alison Gopnik"
        note: "This is an amazing book about how babies learn. Useful in the age of AI."
        cover: "the-philosophical-baby.jpg"
      - title: "French Children Don't Throw Food"
        author: "Pamela Druckerman"
        note: "As I'm starting to think more about how I want to be as a mum, this pushes me to be more laissez-faire."
      - title: "Think Again"
        author: "Adam Grant"
        cover: "think-again.jpg"
      - title: "Originals"
        author: "Adam Grant"
        cover: "originals.jpg"

  - name: "Academic"
    books:
      - title: "An Introduction to Statistical Learning"
        author: "James, Witten, Hastie & Tibshirani"
        note: "Not only an introduction but the book I refer to every time I need to build a model."
        cover: "an-introduction-to-statistical-learning.jpg"
      - title: "A Student's Guide to Bayesian Statistics"
        author: "Ben Lambert"
        note: "I have tried to learn Bayesian statistics 1,000,000 times and this is the only book which has helped."
        cover: "a-student-s-guide-to-bayesian-statistics.jpg"
      - title: "Inside the Black Box"
        author: "Rishi K. Narang"
        note: "The best book as an introduction to quantitative trading for anyone."
        cover: "inside-the-black-box.jpg"
      - title: "The Truth About Linear Regression"
        author: "Cosma Shalizi"
        note: "Most people tend to slap regression models on anything but there is a lot of intuition that comes from thinking deeply about what the coefficients mean, how they are calculated and how to interpret any regression model. This book is the go-to guide."
      - title: "Clean Code in Python"
        author: "Mariano Anaya"
        note: "Reference for medium-advanced Python coding."
        cover: "clean-code-in-python.jpg"
